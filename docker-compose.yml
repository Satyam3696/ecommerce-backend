version: "3.8"

services:

  mysql:

    image: mysql:8
    container_name: mysql-container

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: 9422385211
      MYSQL_DATABASE: database_for_multivendor

    ports:
      - "3306:3306"

    command: --default-authentication-plugin=mysql_native_password

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - ecommerce-network


  


  backend:

    image: ecommerce-backend

    container_name: ecommerce-backend

    restart: always


    depends_on:

      - mysql
      

    ports:

      - "8080:8080"



    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-container:3306/database_for_multivendor

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: 9422385211



    networks:

      - ecommerce-network



networks:

  ecommerce-network:

    driver: bridge



volumes:

  mysql-data:
