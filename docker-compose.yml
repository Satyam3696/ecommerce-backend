version: "3.8"

services:

  mysql:
    image: mysql:8
    container_name: mysql-container

    environment:
      MYSQL_ROOT_PASSWORD: 9422385211
      MYSQL_DATABASE: database_for_multivendor

    ports:
      - "3306:3306"

    networks:
      - ecommerce-network

    volumes:
      - mysql-data:/var/lib/mysql


  backend:

    image: ecommerce-backend
    container_name: ecommerce-backend

    depends_on:
      - mysql

    ports:
      - "9090:8080"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-container:3306/database_for_multivendor

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: 9422385211

    networks:
      - ecommerce-network


networks:

  ecommerce-network:
    driver: bridge


volumes:

  mysql-data:
